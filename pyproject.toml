[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awaaz"
version = "0.1.0"
description = "Open-source voice agent stack: one agent contract, any runtime (cascade / speech-to-speech / hybrid), local-first, cost-transparent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Anzal Hussain Abidi" }]
keywords = ["voice", "agents", "speech", "stt", "tts", "llm", "telephony"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
local = [
  "faster-whisper>=1.0",
  "kokoro-onnx>=0.4",
  "httpx>=0.27",        # ollama client
  "numpy>=1.26",
]
cloud = ["httpx>=0.27", "websockets>=12.0"]
transports = ["websockets>=12.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/anzalabidi/awaaz"

[tool.hatch.build.targets.wheel]
packages = ["src/awaaz"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
