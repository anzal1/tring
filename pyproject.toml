[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tring"
version = "0.4.0"
description = "Open-source voice agent stack: one agent contract, any runtime (cascade / speech-to-speech / hybrid), local-first, cost-transparent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Anzal Hussain Abidi" }]
keywords = ["voice", "agents", "speech", "stt", "tts", "llm", "telephony"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
local = [
  "faster-whisper>=1.0",
  "kokoro-onnx>=0.4",
  "httpx>=0.27",        # ollama client
  "numpy>=1.26",
]
cloud = ["httpx>=0.27", "websockets>=12.0"]
transports = ["websockets>=12.0"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
knowledge = ["chromadb>=0.5", "qdrant-client>=1.9"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",        # tests build provider requests against httpx.MockTransport
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/anzal1/tring"

[tool.hatch.build.targets.wheel]
packages = ["src/tring"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# UP042 (prefer enum.StrEnum) is left off agent.py/events.py: they are the
# contract's anchor files, and swapping their (str, Enum) base for
# enum.StrEnum changes str(member) formatting behavior, not just style, so
# it is intentionally not applied to those two files.
[tool.ruff.lint.per-file-ignores]
"src/tring/agent.py" = ["UP042"]
"src/tring/events.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# events.py and providers/base.py are the contract's anchor files: their
# public signatures (bare `dict`/`list[dict]` on SessionError.details and on
# the LLMProvider/S2SProvider ABC methods) must not change out from under
# every dependent module's overrides, so the narrower [type-arg] check is
# relaxed only for these two files rather than tightened at the source.
[[tool.mypy.overrides]]
module = ["tring.events", "tring.providers.base"]
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
